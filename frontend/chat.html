<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SkillHub — Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
  <style>
    body { background:#f5f4f1; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
    .chat-wrap { display:flex; flex:1; overflow:hidden; max-width:960px; margin:0 auto; width:100%; background:var(--white); border-radius:16px; margin:12px; box-shadow:0 2px 20px rgba(0,0,0,.06); }

    /* ── Lista conversaciones ── */
    .conv-list { width:280px; min-width:240px; border-right:1px solid #f0ede8; display:flex; flex-direction:column; overflow:hidden; }
    .conv-header { padding:18px 16px 12px; border-bottom:1px solid #f0ede8; }
    .conv-title { font-size:.88rem; font-weight:600; color:var(--black); margin-bottom:8px; }
    .conv-search { width:100%; background:#f5f4f1; border:none; border-radius:8px; padding:8px 12px; font-family:var(--font-body); font-size:.82rem; color:var(--black); outline:none; }
    .conv-items { flex:1; overflow-y:auto; }
    .conv-item { display:flex; align-items:center; gap:10px; padding:12px 16px; cursor:pointer; border-bottom:1px solid #f9f7f5; transition:background .15s; }
    .conv-item:hover { background:#fafaf8; }
    .conv-item.active { background:#f0ede8; }
    .conv-av { width:42px; height:42px; border-radius:50%; flex-shrink:0; overflow:hidden; display:flex; align-items:center; justify-content:center; font-weight:600; color:white; font-size:.85rem; }
    .conv-av img { width:100%; height:100%; object-fit:cover; }
    .conv-nombre { font-size:.85rem; font-weight:500; color:var(--black); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .conv-preview { font-size:.75rem; color:var(--gray-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:160px; }
    .conv-badge { background:#111; color:white; font-size:.65rem; border-radius:10px; padding:2px 7px; min-width:18px; text-align:center; flex-shrink:0; }
    .conv-time { font-size:.7rem; color:var(--gray-text); flex-shrink:0; }

    /* ── Área de chat ── */
    .chat-area { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    .chat-header { padding:14px 20px; border-bottom:1px solid #f0ede8; display:flex; align-items:center; gap:12px; background:var(--white); }
    .chat-header-av { width:40px; height:40px; border-radius:50%; overflow:hidden; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:600; color:white; font-size:.85rem; }
    .chat-header-av img { width:100%; height:100%; object-fit:cover; }
    .chat-header-nombre { font-size:.92rem; font-weight:600; color:var(--black); }
    .chat-header-sub { font-size:.75rem; color:var(--gray-text); }
    .chat-header-actions { margin-left:auto; display:flex; gap:8px; }
    .btn-accion { background:#f5f4f1; border:none; border-radius:8px; padding:7px 12px; font-family:var(--font-body); font-size:.78rem; cursor:pointer; color:var(--black); text-decoration:none; }
    .btn-accion:hover { background:#e8e5e0; }

    .mensajes { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:8px; }
    .msg { display:flex; align-items:flex-end; gap:8px; max-width:72%; }
    .msg.mio { align-self:flex-end; flex-direction:row-reverse; }
    .msg-av { width:26px; height:26px; border-radius:50%; flex-shrink:0; overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:.6rem; font-weight:600; color:white; }
    .msg-av img { width:100%; height:100%; object-fit:cover; }
    .msg-burbuja { padding:10px 14px; border-radius:16px; font-size:.85rem; line-height:1.55; word-break:break-word; }
    .msg.otro .msg-burbuja { background:#f0ede8; color:var(--black); border-bottom-left-radius:4px; }
    .msg.mio  .msg-burbuja { background:var(--black); color:white; border-bottom-right-radius:4px; }
    .msg-hora { font-size:.65rem; color:var(--gray-text); margin-top:2px; flex-shrink:0; }

    .fecha-sep { text-align:center; font-size:.72rem; color:var(--gray-text); margin:8px 0; }

    .chat-input { padding:14px 16px; border-top:1px solid #f0ede8; display:flex; gap:10px; align-items:flex-end; background:var(--white); }
    .chat-input textarea { flex:1; background:#f5f4f1; border:1.5px solid transparent; border-radius:12px; padding:10px 14px; font-family:var(--font-body); font-size:.85rem; resize:none; min-height:42px; max-height:120px; outline:none; transition:border-color .2s; line-height:1.5; color:var(--black); }
    .chat-input textarea:focus { border-color:var(--black); background:var(--white); }
    .btn-send { background:var(--black); color:white; border:none; border-radius:10px; width:42px; height:42px; cursor:pointer; font-size:1.1rem; flex-shrink:0; transition:background .15s; }
    .btn-send:hover { background:#333; }
    .btn-send:disabled { opacity:.4; cursor:not-allowed; }

    .empty-chat { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--gray-text); padding:40px; }
    .empty-chat .ico { font-size:2.5rem; margin-bottom:12px; }
    .empty-chat p { font-size:.88rem; color:var(--gray-text); text-align:center; }

    .typing { font-size:.75rem; color:var(--gray-text); padding:0 20px 8px; height:20px; }

    @media(max-width:600px) {
      .chat-wrap { margin:0; border-radius:0; }
      .conv-list { display:none; }
      .conv-list.show { display:flex; position:fixed; inset:0; z-index:100; background:var(--white); width:100%; }
    }
  </style>
</head>
<body>
<nav class="navbar">
  <a href="home.html" class="navbar-logo">
    <img src="logo.svg" style="width:24px;height:24px;" alt="SkillHub"/>SkillHub
  </a>
  <div class="navbar-spacer"></div>
  <a href="explore.html"        class="btn-nav">Explorar</a>
  <a href="notificaciones.html" class="btn-nav">🔔</a>
  <a href="profile.html" class="avatar-btn"><div class="avatar-inner" id="nav-avatar">??</div></a>
</nav>

<div class="chat-wrap">
  <!-- Lista conversaciones -->
  <div class="conv-list" id="conv-list">
    <div class="conv-header">
      <div class="conv-title">Mensajes</div>
      <input class="conv-search" type="text" placeholder="Buscar conversación..." id="conv-search" oninput="filtrarConvs(this.value)"/>
    </div>
    <div class="conv-items" id="convs">
      <div style="padding:20px;font-size:.82rem;color:var(--gray-text);text-align:center">Cargando...</div>
    </div>
  </div>

  <!-- Área de chat -->
  <div class="chat-area" id="chat-area">
    <div class="empty-chat" id="empty-chat">
      <div class="ico">💬</div>
      <p><strong>Tus mensajes</strong><br/>Selecciona una conversación o escríbele a alguien desde su perfil.</p>
    </div>
    <div id="chat-activo" style="display:none;flex:1;flex-direction:column;overflow:hidden;">
      <div class="chat-header" id="chat-header"></div>
      <div class="mensajes" id="mensajes"></div>
      <div class="typing" id="typing"></div>
      <div class="chat-input">
        <textarea id="txt-msg" placeholder="Escribe un mensaje..." rows="1"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();enviar()}"
          oninput="autoResize(this)"></textarea>
        <button class="btn-send" id="btn-send" onclick="enviar()">↑</button>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  requireAuth();

  let miPerfil    = null;
  let conActual   = null;
  let interval    = null;
  let todasConvs  = [];

  const params   = new URLSearchParams(window.location.search);
  const conParam = params.get('con') || sessionStorage.getItem('chatCon');
  sessionStorage.removeItem('chatCon');

  const colores = [
    'linear-gradient(135deg,#c8b8a2,#a08060)',
    'linear-gradient(135deg,#a0c8a0,#608060)',
    'linear-gradient(135deg,#d0a0c0,#a06080)',
    'linear-gradient(135deg,#a0b8d0,#607090)',
    'linear-gradient(135deg,#d0c8a0,#a09060)',
  ];
  const colorPor = id => colores[(id?.charCodeAt?.(id.length-1)||0) % colores.length];

  function avEl(usuario, size=38) {
    const bg = colorPor(usuario?._id||'');
    if (usuario?.avatar)
      return `<div style="width:${size}px;height:${size}px;border-radius:50%;overflow:hidden;flex-shrink:0;"><img src="${usuario.avatar}" style="width:100%;height:100%;object-fit:cover;"/></div>`;
    return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${bg};display:flex;align-items:center;justify-content:center;font-weight:600;color:white;font-size:${size*.32}px;flex-shrink:0;">${iniciales(usuario?.nombre||'?')}</div>`;
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120)+'px';
  }

  function tiempoRelativo(fecha) {
    const d = new Date(fecha);
    const hoy = new Date();
    if (d.toDateString() === hoy.toDateString())
      return d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
    const ayer = new Date(hoy); ayer.setDate(ayer.getDate()-1);
    if (d.toDateString() === ayer.toDateString()) return 'Ayer';
    return d.toLocaleDateString('es',{day:'numeric',month:'short'});
  }

  async function init() {
    try {
      miPerfil = await obtenerMiPerfil();
      document.getElementById('nav-avatar').textContent = iniciales(miPerfil.nombre);
    } catch(e) { console.error(e); return; }

    await cargarConversaciones();

    if (conParam) {
      try {
        const perfil = await obtenerPerfil(conParam);
        abrirChat(perfil);
      } catch {}
    }
  }

  async function cargarConversaciones() {
    try {
      todasConvs = await obtenerConversaciones();
      renderConvs(todasConvs);
    } catch {}
  }

  function filtrarConvs(q) {
    const filtradas = q
      ? todasConvs.filter(c => c.usuario.nombre.toLowerCase().includes(q.toLowerCase()))
      : todasConvs;
    renderConvs(filtradas);
  }

  function renderConvs(convs) {
    const div = document.getElementById('convs');
    if (!convs.length) {
      div.innerHTML = '<div style="padding:24px 16px;font-size:.82rem;color:var(--gray-text);text-align:center">Sin conversaciones aún.<br/>Escríbele a alguien desde su perfil.</div>';
      return;
    }
    div.innerHTML = convs.map(c => `
      <div class="conv-item ${conActual?._id===c.usuario._id?'active':''}"
           onclick='abrirChatDesdeConv(${JSON.stringify(c.usuario)})'>
        ${avEl(c.usuario, 42)}
        <div style="flex:1;overflow:hidden;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:4px;">
            <div class="conv-nombre">${c.usuario.nombre}</div>
            <div class="conv-time">${tiempoRelativo(c.fecha)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:4px;">
            <div class="conv-preview">${c.ultimoMensaje||''}</div>
            ${c.noLeidos ? `<span class="conv-badge">${c.noLeidos}</span>` : ''}
          </div>
        </div>
      </div>`).join('');
  }

  function abrirChatDesdeConv(usuario) {
    abrirChat(usuario);
  }

  async function abrirChat(usuario) {
    conActual = usuario;
    clearInterval(interval);

    document.getElementById('empty-chat').style.display  = 'none';
    const ca = document.getElementById('chat-activo');
    ca.style.display       = 'flex';
    ca.style.flexDirection = 'column';
    ca.style.flex          = '1';
    ca.style.overflow      = 'hidden';

    const tipo = usuario.tipoUsuario === 'empresa' ? '🏢 Empresa' : '👩 Candidata';
    document.getElementById('chat-header').innerHTML = `
      ${avEl(usuario, 40)}
      <div>
        <div class="chat-header-nombre">${usuario.nombre}</div>
        <div class="chat-header-sub">${tipo} ${usuario.ciudad ? '· '+usuario.ciudad : ''}</div>
      </div>
      <div class="chat-header-actions">
        <a class="btn-accion" href="profile.html" onclick="sessionStorage.setItem('verPerfilId','${usuario._id}');return true;">Ver perfil</a>
      </div>`;

    await cargarMensajes();
    cargarConversaciones();
    interval = setInterval(cargarMensajes, 3000);
  }

  let ultimosMsgs = '';
  async function cargarMensajes() {
    if (!conActual || !miPerfil) return;
    try {
      const msgs = await obtenerMensajes(conActual._id);
      const hash = msgs.map(m=>m._id).join();
      if (hash === ultimosMsgs) return; // sin cambios
      ultimosMsgs = hash;

      const div = document.getElementById('mensajes');
      const wasBottom = div.scrollTop + div.clientHeight >= div.scrollHeight - 30;

      let lastFecha = '';
      div.innerHTML = msgs.map(m => {
        const mio  = String(m.emisorId?._id||m.emisorId) === String(miPerfil._id);
        const hora = new Date(m.createdAt).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
        const fecha = new Date(m.createdAt).toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
        let sep = '';
        if (fecha !== lastFecha) { sep = `<div class="fecha-sep">${fecha}</div>`; lastFecha = fecha; }
        const emisorPerfil = mio ? miPerfil : conActual;
        return `${sep}
          <div class="msg ${mio?'mio':'otro'}">
            ${!mio ? avEl(emisorPerfil, 26) : ''}
            <div>
              <div class="msg-burbuja">${m.texto}</div>
              <div class="msg-hora" style="text-align:${mio?'right':'left'}">${hora}${mio&&m.leido?' ✓✓':''}</div>
            </div>
          </div>`;
      }).join('');

      if (wasBottom || msgs.length < 5) div.scrollTop = div.scrollHeight;
    } catch {}
  }

  async function enviar() {
    if (!conActual || !miPerfil) return;
    const txt = document.getElementById('txt-msg').value.trim();
    if (!txt) return;
    const btn = document.getElementById('btn-send');
    btn.disabled = true;
    document.getElementById('txt-msg').value = '';
    document.getElementById('txt-msg').style.height = 'auto';
    try {
      await enviarMensaje(conActual._id, txt);
      ultimosMsgs = ''; // forzar recarga
      await cargarMensajes();
      cargarConversaciones();
    } catch(err) { alert('Error: '+err.message); }
    finally { btn.disabled = false; document.getElementById('txt-msg').focus(); }
  }

  init();
</script>
</body>
</html>
